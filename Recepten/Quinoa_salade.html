<!DOCTYPE html>
<html>

<head>
    <title>Quinoa salade</title>
</head>

<body>
    <title>Quinoa salade</title>
    <h1>Ingredienten</h1>
    <ul>
        <li>Quinoa (200g)</li>
        <li>Avocado (1)</li>
        <li>Paprika (1)</li>
        <li>Cherri tomaatjes (250g)</li>
        <li>Komkommer (1)</li>
        <li>Feta (250g)</li>
        <li>(rode) ui (1-2)</li>
        <li>walnoten</li>
        <li>Extra vierge olijfolie</li>
    </ul>
    <h2>Bereiden</h2>
    <ol>
        <li>Kook de quinoa</li>
        <li>Snij alles en gooi in een grote kom</li>
        <li>Husselen en vreten!</li>
    </ol>
</body>

</html>
